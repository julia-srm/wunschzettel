<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wunschzettel</title>
  <meta name="description" content="Mein Wunschzettel für Weihnachten" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Nachthimmel -->
  <div class="sky" id="sky" aria-hidden="true"></div>

  <!-- Weihnachtsbäume links & rechts -->
  <div class="tree-wrap left" aria-hidden="true"><canvas class="tree-canvas"></canvas></div>
  <div class="tree-wrap right" aria-hidden="true"><canvas class="tree-canvas"></canvas></div>

  <canvas id="snow" aria-hidden="true"></canvas>

  <div class="page">
    <header class="hero">
      <p class="eyebrow">✨ Wunschzettel <span id="year"></span> ✨</p>
      <h1 id="title">Wunschzettel</h1>
      <p id="message" class="message"></p>
      <div class="countdown" id="countdown"></div>
    </header>

    <!-- Quiz -->
    <section class="quiz" id="quiz" aria-labelledby="quiz-title">
      <div class="card quiz-card" id="quiz-card">
        <div class="sass" id="sass" role="status" aria-live="assertive"></div>
        <button class="fake-close" id="fake-close" type="button" aria-label="Schließen">✕</button>
        <div id="quiz-body"></div>
      </div>
    </section>

    <!-- Geschenke -->
    <main id="main" hidden>
      <section class="card results-bar" id="results-bar"></section>

      <section class="section">
        <h2 class="section-title">Perfekt für dich ✨</h2>
        <p class="section-sub" id="match-sub"></p>
        <ul class="wishes" id="wishes-match"></ul>
      </section>

      <section class="section" id="rest-section">
        <h2 class="section-title">Auch noch auf meiner Liste 🎀</h2>
        <p class="section-sub" id="rest-sub"></p>
        <ul class="wishes" id="wishes-rest"></ul>
      </section>
    </main>

    <footer id="footer" hidden>Mit 💗 und ganz viel Schnee gemacht</footer>
  </div>

  <script src="wishlist.js"></script>
  <script src="app.js"></script>
</body>
</html>
