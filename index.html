<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wunschzettel</title>
  <meta name="description" content="Mein Wunschzettel für Weihnachten" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="quiz-open">
  <div class="deco" id="deco" aria-hidden="true"></div>
  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow">✨ Wunschzettel <span id="year"></span> ✨</p>
      <h1 id="title">Wunschzettel</h1>
      <p id="message" class="message"></p>
      <div class="countdown" id="countdown" aria-live="off"></div>
    </div>

    <svg class="tree" viewBox="0 0 320 380" role="img" aria-label="Geschmückter Weihnachtsbaum mit Geschenken darunter">
      <defs>
        <linearGradient id="g-tree" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3fa57a" />
          <stop offset="1" stop-color="#1d5a41" />
        </linearGradient>
        <radialGradient id="g-shine" cx=".32" cy=".3" r=".6">
          <stop offset="0" stop-color="#fff" stop-opacity=".95" />
          <stop offset=".35" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- snow on the ground -->
      <ellipse cx="160" cy="352" rx="150" ry="16" fill="#fff" opacity=".9" />

      <!-- trunk -->
      <rect x="147" y="270" width="26" height="40" rx="4" fill="#8b5a3c" />

      <!-- tiers -->
      <path d="M160 150 L46 280 Q160 302 274 280 Z" fill="url(#g-tree)" />
      <path d="M160 95 L70 205 Q160 224 250 205 Z" fill="url(#g-tree)" />
      <path d="M160 45 L98 135 Q160 150 222 135 Z" fill="url(#g-tree)" />

      <!-- garlands -->
      <g fill="none" stroke-linecap="round" stroke-width="5">
        <path d="M108 120 Q160 142 210 116" stroke="#ff9fca" />
        <path d="M84 190 Q160 218 238 178" stroke="#ffd6e8" />
        <path d="M62 262 Q160 294 258 250" stroke="#ff9fca" />
      </g>

      <!-- twinkling lights -->
      <g class="lights">
        <circle cx="128" cy="129" r="3.2" fill="#fff6a8" />
        <circle cx="160" cy="133" r="3.2" fill="#ffc2dd" />
        <circle cx="192" cy="124" r="3.2" fill="#fff6a8" />
        <circle cx="112" cy="200" r="3.2" fill="#ffc2dd" />
        <circle cx="150" cy="206" r="3.2" fill="#fff6a8" />
        <circle cx="190" cy="202" r="3.2" fill="#ffc2dd" />
        <circle cx="222" cy="188" r="3.2" fill="#fff6a8" />
        <circle cx="92" cy="274" r="3.2" fill="#fff6a8" />
        <circle cx="134" cy="282" r="3.2" fill="#ffc2dd" />
        <circle cx="178" cy="282" r="3.2" fill="#fff6a8" />
        <circle cx="222" cy="270" r="3.2" fill="#ffc2dd" />
      </g>

      <!-- baubles -->
      <g>
        <circle cx="140" cy="102" r="8" fill="#ff5fa2" /><circle cx="140" cy="102" r="8" fill="url(#g-shine)" />
        <circle cx="122" cy="165" r="9" fill="#f2b84b" /><circle cx="122" cy="165" r="9" fill="url(#g-shine)" />
        <circle cx="200" cy="160" r="9" fill="#fff" /><circle cx="200" cy="160" r="9" fill="url(#g-shine)" />
        <circle cx="96" cy="240" r="10" fill="#ff5fa2" /><circle cx="96" cy="240" r="10" fill="url(#g-shine)" />
        <circle cx="168" cy="244" r="10" fill="#7a1846" /><circle cx="168" cy="244" r="10" fill="url(#g-shine)" />
        <circle cx="232" cy="236" r="10" fill="#f2b84b" /><circle cx="232" cy="236" r="10" fill="url(#g-shine)" />
      </g>

      <!-- fun ornaments -->
      <g class="tree-emoji" text-anchor="middle" dominant-baseline="central">
        <text x="182" y="98" font-size="17">🎀</text>
        <text x="160" y="168" font-size="20">☕</text>
        <text x="132" y="232" font-size="20">🥐</text>
        <text x="204" y="250" font-size="20">💍</text>
        <text x="236" y="202" font-size="15">🕯️</text>
        <text x="84" y="206" font-size="15">📚</text>
      </g>

      <!-- star -->
      <polygon class="star" fill="#f2b84b" stroke="#fff3c4" stroke-width="1.5" stroke-linejoin="round"
        points="160,16 165,30 179,30.8 168.1,39.6 171.8,53.2 160,45.5 148.2,53.2 151.9,39.6 141,30.8 155,30" />

      <!-- presents -->
      <g class="presents">
        <!-- big pink -->
        <rect x="34" y="296" width="72" height="56" rx="4" fill="#ff5fa2" />
        <rect x="30" y="290" width="80" height="13" rx="3" fill="#e0337f" />
        <rect x="65" y="290" width="10" height="62" fill="#fff" />
        <ellipse cx="61" cy="284" rx="11" ry="6" transform="rotate(-25 61 284)" fill="#fff" />
        <ellipse cx="79" cy="284" rx="11" ry="6" transform="rotate(25 79 284)" fill="#fff" />
        <circle cx="70" cy="288" r="4" fill="#ffe3ee" />

        <!-- white with pink ribbon -->
        <rect x="210" y="284" width="76" height="68" rx="4" fill="#fff" />
        <g fill="#ffc2dd">
          <circle cx="224" cy="312" r="3" /><circle cx="244" cy="332" r="3" /><circle cx="272" cy="314" r="3" /><circle cx="270" cy="340" r="3" /><circle cx="226" cy="340" r="3" />
        </g>
        <rect x="206" y="278" width="84" height="13" rx="3" fill="#ffe3ee" />
        <rect x="243" y="278" width="10" height="74" fill="#e0337f" />
        <ellipse cx="239" cy="272" rx="12" ry="6.5" transform="rotate(-25 239 272)" fill="#e0337f" />
        <ellipse cx="257" cy="272" rx="12" ry="6.5" transform="rotate(25 257 272)" fill="#e0337f" />
        <circle cx="248" cy="276" r="4.5" fill="#ff5fa2" />

        <!-- small gold -->
        <rect x="114" y="316" width="52" height="36" rx="4" fill="#f2b84b" />
        <rect x="135" y="316" width="9" height="36" fill="#fff" />
        <rect x="114" y="329" width="52" height="8" fill="#fff" />
        <ellipse cx="133" cy="312" rx="8" ry="4.5" transform="rotate(-25 133 312)" fill="#fff" />
        <ellipse cx="147" cy="312" rx="8" ry="4.5" transform="rotate(25 147 312)" fill="#fff" />

        <!-- small berry -->
        <rect x="170" y="322" width="36" height="30" rx="4" fill="#7a1846" />
        <rect x="184" y="322" width="8" height="30" fill="#ff9fca" />
        <ellipse cx="182" cy="318" rx="7" ry="4" transform="rotate(-25 182 318)" fill="#ff9fca" />
        <ellipse cx="194" cy="318" rx="7" ry="4" transform="rotate(25 194 318)" fill="#ff9fca" />
      </g>
    </svg>
  </header>

  <main id="main" hidden>
    <section class="results-bar" id="results-bar"></section>

    <section class="section">
      <h2 class="section-title">Perfekt für dich ✨</h2>
      <p class="section-sub" id="match-sub"></p>
      <ul class="wishes" id="wishes-match"></ul>
    </section>

    <section class="section" id="rest-section">
      <h2 class="section-title">Auch noch auf meiner Liste 🎀</h2>
      <p class="section-sub" id="rest-sub"></p>
      <ul class="wishes" id="wishes-rest"></ul>
    </section>
  </main>

  <footer id="footer" hidden>Mit 💗, ☕ und einer Extraportion Glitzer gemacht</footer>

  <!-- Quiz -->
  <div class="quiz" id="quiz" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
    <div class="quiz-card" id="quiz-card">
      <div class="sass" id="sass" role="status" aria-live="assertive"></div>
      <button class="fake-close" id="fake-close" type="button" aria-label="Schließen">✕</button>
      <div id="quiz-body"></div>
    </div>
  </div>

  <script src="wishlist.js"></script>
  <script src="app.js"></script>
</body>
</html>
